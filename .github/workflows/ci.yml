name: app-service-pipeline

on:
  push:
    branches: [dev, qa, uat, preprod, main]
  pull_request:
    branches:
      - main

jobs:
  dockerfile-lint:
    name: "Dockerfile lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build-test:
    name: "Build and test"
    needs: dockerfile-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make build && make test

  security-scan:
    name: "Security scan"
    needs: build-test
    uses: angelowu0/gh-sharedrepo-example/.github/workflows/security-scan.yml@main
    with:
      severity: CRITICAL,HIGH

  python-sast:
    name: "Python SAST (bandit)"
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit
        run: bandit -r . -ll --exclude ./.venv

  deploy-dev:
    name: "Deploy to dev"
    needs: [security-scan, python-sast]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    uses: angelowu0/gh-sharedrepo-example/.github/workflows/develop.yml@main
    with:
      environment: dev
    secrets:
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}

  deploy-qa:
    name: "Deploy to qa"
    needs: [security-scan, python-sast, deploy-dev]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/qa' }}
    uses: angelowu0/gh-sharedrepo-example/.github/workflows/develop.yml@main
    with:
      environment: qa
    secrets:
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}

  deploy-uat:
    name: "Deploy to uat"
    needs: [security-scan, python-sast, deploy-qa]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/uat' }}
    uses: angelowu0/gh-sharedrepo-example/.github/workflows/develop.yml@main
    with:
      environment: uat
    secrets:
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}

  deploy-preprod:
    name: "Deploy to preprod"
    needs: [security-scan, python-sast, deploy-uat]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/preprod' }}
    uses: angelowu0/gh-sharedrepo-example/.github/workflows/develop.yml@main
    with:
      environment: preprod
    secrets:
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}